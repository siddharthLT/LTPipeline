{% extends "base.html" %}
{% load static %}
{% block title %}Log in · Lunartree{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth__card">
    <div class="brand auth__brand">
      <img class="brand__mark" src="{% static 'img/mark.svg' %}" alt="" width="32" height="32">
      <span class="brand__name">Lunartree <span class="sep">/</span> Pipeline</span>
    </div>
    <div class="auth__head">
      <span class="eyebrow">Sign in</span>
      <h1 class="t-display">Welcome back</h1>
    </div>
    <form method="post" class="auth__form" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="field-error" role="alert">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <div>
        <label class="field-label" for="{{ form.username.id_for_label }}">Email</label>
        <input class="field__input field__input--plain" type="email" name="username" id="{{ form.username.id_for_label }}"
               value="{{ form.username.value|default:'' }}" autocomplete="email" autofocus required
               {% if form.errors %}aria-invalid="true"{% endif %}>
      </div>
      <div>
        <label class="field-label" for="{{ form.password.id_for_label }}">Password</label>
        <div class="pw">
          <input class="field__input field__input--plain" type="password" name="password" id="{{ form.password.id_for_label }}"
                 autocomplete="current-password" required {% if form.errors %}aria-invalid="true"{% endif %}>
          <button type="button" class="pw__toggle" data-pw-toggle aria-label="Show password" aria-pressed="false">
            <svg class="pw__eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw__eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M2.5 12S6 5.5 12 5.5c1.9 0 3.5.6 4.9 1.5M21.5 12S18 18.5 12 18.5c-1.9 0-3.5-.6-4.9-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2M3.5 3.5l17 17"/></svg>
          </button>
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn--primary btn--block">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
